<!DOCTYPE html><html lang="zh-CN"> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#16211c"><meta name="description" content="Gooseleap — 每天一小跃。"><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪿</text></svg>"><title>Gooseleap 博客</title><style>:root{--paper: #f3eee3;--surface: #fffdf8;--ink: #1c2722;--ink-2: #536057;--ink-3: #8c958c;--line: #ded6c5;--accent: #df5a32;--teal: #2d6a61;--font-sans: "Avenir Next", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;--font-serif: "Iowan Old Style", "Palatino Linotype", "Songti SC", Georgia, serif}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 90% 0%,rgba(223,90,50,.08),transparent 30%),var(--paper);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}.site-head{max-width:900px;margin:0 auto;padding:28px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:10px}.mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:20px}.brand strong{display:block;font-family:var(--font-serif);font-size:20px;font-weight:500}.brand small{display:block;color:var(--ink-3);font-size:10px;letter-spacing:.14em;margin-top:2px}nav{display:flex;gap:16px;color:var(--ink-2);font-size:12px}nav a:hover{color:var(--accent)}main{max-width:780px;margin:0 auto;padding:24px 24px 80px}footer{max-width:900px;margin:0 auto;padding:24px;border-top:1px solid var(--line);color:var(--ink-3);font-size:10px;display:flex;justify-content:space-between;gap:16px}h1,h2,h3{font-family:var(--font-serif);font-weight:500;letter-spacing:-.02em}.post-list{display:flex;flex-direction:column;gap:12px}.post-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:block;transition:transform .15s ease,box-shadow .15s ease}.post-card:hover{transform:translateY(-2px);box-shadow:0 12px 28px #2d271b12}.post-card h2{font-size:22px;margin:0 0 7px}.post-card p{color:var(--ink-2);font-size:12px;line-height:1.7;margin:0 0 12px}.meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--ink-3);font-size:10px}.tag{border:1px solid var(--line);border-radius:999px;padding:2px 7px}.empty{text-align:center;padding:80px 20px;color:var(--ink-3)}.empty h1{color:var(--ink);font-size:32px;margin-bottom:8px}article{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,5vw,48px)}article h1{font-size:clamp(30px,5vw,46px);line-height:1.1;margin:0 0 12px}.post-body{font-size:15px;line-height:1.85;color:var(--ink)}.post-body h1,.post-body h2,.post-body h3{margin-top:1.8em}.post-body a{color:var(--teal);text-decoration:underline;text-underline-offset:3px}.post-body blockquote{border-left:3px solid var(--accent);margin-left:0;padding-left:16px;color:var(--ink-2)}.post-body code{background:#1c27220f;border-radius:5px;padding:2px 5px;font-size:.88em}.post-body pre{background:#16211c;color:#f7f1e3;padding:16px;border-radius:12px;overflow:auto}.post-body pre code{background:transparent;padding:0}.post-body img{max-width:100%;border-radius:10px}.back{display:inline-block;color:var(--ink-3);font-size:11px;margin-bottom:18px}@media(max-width:600px){.site-head{align-items:flex-start;flex-direction:column}nav{gap:12px}footer{flex-direction:column}}
</style></head> <body> <header class="site-head"> <a class="brand" href="/"> <span class="mark">🪿</span> <span> <strong>Gooseleap 博客</strong> <small>每天一小跃</small> </span> </a> <nav> <a href="/">文章</a> <a href="/rss.xml">RSS</a> <a href="https://app.699299.xyz">工作台</a> </nav> </header> <main> <div class="empty"> <h1>还没有文章</h1> <p>在 Gooseleap 工作台里把一篇 post 设为「公开 + 已发布」后，这里会出现。</p> </div> </main> <footer> <span>公开内容 · GitHub Pages</span> <span>miaorui.github.io</span> </footer> </body></html>
